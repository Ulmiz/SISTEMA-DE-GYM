<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitControl - Sistema de Recepción para Gimnasio</title>
  <meta name="description" content="Sistema web ágil y táctil para recepción de gimnasio con control de acceso por semáforo, cobranza rápida y corte de caja diario.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/css/styles.css">
</head>
<body>
  <!-- CONTENEDOR DE LOGIN MODULAR -->
  <div id="loginContainer"></div>

  <!-- BARRA SUPERIOR / HEADER MODULAR -->
  <header class="top-nav" id="headerNav"></header>

  <!-- BANNER INFORMATIVO DE ROL MODULAR -->
  <div class="role-banner" id="roleBanner"></div>

  <!-- CONTENEDOR PRINCIPAL DE VISTAS MODULARES (Dashboard, Socios, Corte, Admin) -->
  <main class="main-container" id="appMain"></main>

  <!-- CONTENEDOR DE MODALES MODULARES (Cobro y Ticket) -->
  <div id="modalContainer"></div>

  <!-- CONTENEDOR DE NOTIFICACIONES TOAST -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ARCHIVO PRINCIPAL DE LA APLICACIÓN -->
  <script type="module" src="../src/js/app.js"></script>
</body>
</html>
